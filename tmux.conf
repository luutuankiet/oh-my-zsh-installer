# Minimal tmux config tuned for modern terminals + Claude Code.
# Intentionally vanilla — no prefix remap, no custom pane bindings.
# Only the lines below are needed to keep input working correctly.
# See TMUX-NOTES.md for the debugging story behind each line.

# Advertise tmux's real terminal capabilities to the inner shell.
set -g default-terminal "tmux-256color"

# Truecolor passthrough (RGB) for modern terminals that advertise xterm-256color.
set -ga terminal-overrides ",xterm-256color:RGB"

# Forward function/arrow keys as xterm-style sequences instead of raw ESC chars.
# Without this, arrow keys can leak into TUI inputs as literal "[A" etc.
set -g xterm-keys on

# Accept & forward CSI-u extended key sequences. Modern TUIs (including Claude
# Code) rely on these — tmux drops them silently by default, which shows up as
# "I have to hit the key twice for it to register."
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

# Shrink the ESC delay. Default (500ms) can eat keypresses that arrive close
# together; 10ms is responsive without breaking legitimate Meta/ESC sequences.
set -sg escape-time 10

# Quality-of-life: mouse support for scroll/select/resize.
set -g mouse on
