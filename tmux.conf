# CLAUDE CODE CORRECTNESS — load-bearing.
# If arrow keys emit raw `ESC[A` into agent prompts, or keys need multiple
# presses to register, the six lines immediately below are the fix. They
# enable extended xterm key sequences + truecolor. Don't remove them while
# debugging other issues — they're unrelated to anything else in this file.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g xterm-keys on
set -sg escape-time 10
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

# alias reload conf command
bind r source-file ~/.tmux.conf

# alias resize panes commands to vim-like arrow keys
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r H resize-pane -L 5

# for maximize
bind -r m resize-pane -Z

# vim like pane nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# enable mouse use
set -g mouse on

# Vi copy-mode defaults: Space begins selection, Enter copies. tmux vi `v`
# is rectangle-toggle (not begin-selection — surprise vs. vim), `y` is
# unbound. We keep those defaults.
set-window-option -g mode-keys vi

# Mouse drag: on release, DON'T auto-copy/cancel. Unbind so the selection
# stays live and you finish the copy with Enter. Without this, tmux's
# default `copy-selection-and-cancel` on MouseDragEnd1Pane fires the moment
# you lift the button.
unbind-key -T copy-mode    MouseDragEnd1Pane
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# Reset any vi-mode overrides from prior source-file runs. `source-file`
# never unsets bindings, so stale overrides from previous sessions survive
# until explicitly reverted (or a kill-server). Defaults restored here:
#   v → rectangle-toggle (tmux default)
#   y / C-v → unbound (tmux defaults)
bind-key -T copy-mode-vi v send -X rectangle-toggle
unbind-key -T copy-mode-vi y
unbind-key -T copy-mode-vi C-v

# macOS-only clipboard plumbing.
#
# On macOS we pipe the Enter copy through pbcopy (wrapped in reattach-to-
# user-namespace so pbcopy reaches the GUI clipboard even when tmux was
# spawned by a non-Aqua process like cc-web's LaunchAgent). Full paths are
# required — copy-pipe-and-cancel runs its command via /bin/sh -c with a
# minimal PATH that excludes /opt/homebrew/bin.
#
# set-clipboard on enables OSC 52 as belt-and-suspenders so iTerm2 also
# receives the selection directly.
#
# On Linux (thinkpad etc.) none of this applies: selections live in tmux's
# own buffer, `prefix + ]` pastes. No GUI clipboard, no OSC 52 forwarding.
if-shell 'uname | grep -q Darwin' ' \
  set -s set-clipboard on ; \
  bind-key -T copy-mode    Enter send -X copy-pipe-and-cancel "/opt/homebrew/bin/reattach-to-user-namespace /usr/bin/pbcopy" ; \
  bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "/opt/homebrew/bin/reattach-to-user-namespace /usr/bin/pbcopy" \
'
